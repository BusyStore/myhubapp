<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>
        <div class="card-grid" id="modelContainer"></div>
        <div id="videoContainer" class="video-grid"></div>
        
    </main>

    <script src="js/app.js"></script>
    <script>
async function loadStandaloneModels() {
    const WORKER_API_URL = "https://myhubapp.dathalay1.workers.dev/api/catalog";
    
    try {
        const response = await fetch(WORKER_API_URL);
        const data = await response.json();

        if (Array.isArray(data)) {
            const modelContainer = document.getElementById('modelContainer') || document.getElementById('model-container');
            if (!modelContainer) return;
            
            modelContainer.style.cssText = "display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px;";
            modelContainer.innerHTML = '';

            const customModelMap = new Map();

            data.forEach(item => {
                if (item && typeof item === 'object') {
                    const mName = item.model_name ? String(item.model_name).replace(/[\r\n]+/g, '').trim() : '';
                    let mImg = item.model_image || item.modelImage || '';
                    mImg = String(mImg).trim();

                    // Google Drive Link ဖြစ်ပါက Direct Link သို့ ပြောင်းရန်
                    if (mImg.includes('drive.google.com') || mImg.includes('docs.google.com')) {
                        const match = mImg.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) {
                            mImg = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }

                    if (mName && mName !== '') {
                        const key = mName.toLowerCase();
                        if (!customModelMap.has(key)) {
                            customModelMap.set(key, { name: mName, image: mImg });
                        } else if (mImg && !customModelMap.get(key).image) {
                            customModelMap.get(key).image = mImg;
                        }
                    }
                }
            });

            const modelData = Array.from(customModelMap.values());

            if (modelData.length === 0) {
                modelContainer.innerHTML = '<p style="color:#888; text-align:center; width:100%;">Model မရှိသေးပါ။</p>';
                return;
            }

            modelData.forEach(m => {
                const displayImg = m.image !== '' ? m.image : 'https://via.placeholder.com/150';
                modelContainer.innerHTML += `
                    <a href="model.html?model=${encodeURIComponent(m.name)}" style="display:block; text-decoration:none; background:#1a1a24; border-radius:10px; overflow:hidden; border:1px solid #282836; text-align:center;">
                        <div style="width:100%; height:135px; overflow:hidden; background:#000;">
                            <img src="${displayImg}" alt="${m.name}" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                        </div>
                        <div style="padding:6px 4px;">
                            <span style="font-size:12px; font-weight:600; color:#fff; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.name}</span>
                        </div>
                    </a>
                `;
            });
        }
    } catch (error) {
        console.error("Standalone Model Fetch Error:", error);
    }
}

document.addEventListener("DOMContentLoaded", loadStandaloneModels);
    </script>
    

</body>
</html>
