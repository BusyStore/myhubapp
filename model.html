<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Models</h1>
        </div>
        <div class="card-grid" id="modelContainer"></div>
    </main>

        <script src="js/app.js"></script>
    <script>
        // Model ခလုတ်များ ဖန်တီးပေးခြင်း
        function renderModels() {
            // ID ကို modelContainer ဟု ပြင်ထားပါသည်
            const modelContainer = document.getElementById('modelContainer');
            if (!modelContainer) return;

            if (modelData.length === 0) {
                modelContainer.innerHTML = '<p style="color:#888; text-align:center; width:100%;">Model များ မရှိသေးပါခင်ဗျာ။</p>';
                return;
            }

            // Model တစ်ခုချင်းစီကို Card/Button အဖြစ် Render လုပ်ပေးခြင်း
            modelContainer.innerHTML = modelData.map(m => `
                <a href="index.html?model=${encodeURIComponent(m.name)}" class="model-card" style="display:inline-block; margin:6px; padding:10px 18px; background:#222; color:#fff; border-radius:20px; text-decoration:none; font-size:14px; border:1px solid #333;">
                    <i class="fa-solid fa-user"></i> ${m.name}
                </a>
            `).join('');
        }

        // စာမျက်နှာ ပွင့်ချိန်တွင် renderModels ကို ခေါ်ပေးခြင်း
        document.addEventListener("DOMContentLoaded", () => {
            if (videoData.length > 0) {
                renderModels();
            }
        });
    </script>

</body>
</html>
