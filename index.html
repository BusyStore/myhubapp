<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busy Store - Video Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 2px solid #e50914;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      color: #e50914;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      border-left: 4px solid #e50914;
      padding-left: 8px;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      border: 1px solid #333;
    }

    .video-card h3 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #ddd;
      word-break: break-word;
    }

    .play-btn {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .play-btn:hover {
      background-color: #b20710;
    }

    /* Modal Video Player Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      background: #000;
      width: 90%;
      max-width: 700px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #444;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 15px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1010;
      background: rgba(0,0,0,0.5);
      padding: 0 8px;
      border-radius: 50%;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      display: block;
    }

    #status-msg {
      text-align: center;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">HUB</div>
  </div>

  <h2 class="section-title">Videos</h2>
  
  <div id="status-msg">Loading videos...</div>
  <div id="video-grid" class="video-grid"></div>

  <!-- Modal Video Player Popup -->
  <div id="videoModal" class="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    // သင့် Cloudflare Worker ၏ Link ကို အောက်ပါ နေရာတွင် ထည့်ပေးပါ
    const WORKER_URL = "https://myplayapp.dathalay1.workers.dev";

    async function loadVideos() {
      const grid = document.getElementById("video-grid");
      const statusMsg = document.getElementById("status-msg");

      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        // Data စစ်ဆေးမှု ပိုမို ခိုင်မာအောင် ပြင်ထားပါသည်
        const videoList = (data && data.videos) ? data.videos : [];

        if (data.success && videoList.length > 0) {
          statusMsg.style.display = "none";
          grid.innerHTML = "";

          videoList.forEach((video) => {
            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
              <h3>${video.title}</h3>
              <button class="play-btn" onclick="openPlayer('${video.embed_url}')">▶ Play Video</button>
            `;
            grid.appendChild(card);
          });
        } else {
          statusMsg.innerText = "ဗီဒီယိုများ မရှိသေးပါ သို့မဟုတ် Telegram Channel တွင် Video Post မရှိသေးပါ။";
        }
      } catch (err) {
        statusMsg.innerText = "Error loading videos: " + err.message;
      }
    }

    function openPlayer(embedUrl) {
      const modal = document.getElementById("videoModal");
      const content = document.getElementById("modalContent");

      content.innerHTML = `
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <iframe src="${embedUrl}" allowfullscreen></iframe>
      `;

      modal.style.display = "flex";
    }

    function closePlayer() {
      const modal = document.getElementById("videoModal");
      const content = document.getElementById("modalContent");
      content.innerHTML = "";
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("videoModal");
      if (event.target === modal) {
        closePlayer();
      }
    };

    // ဗီဒီယိုများ စတင်ခေါ်ယူရန်
    loadVideos();
  </script>

</body>
</html>
