<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 40px;
    }

    header {
      background-color: #14141d;
      padding: 15px 20px;
      border-bottom: 1px solid #282838;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      color: #ff0055;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1250px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      border-left: 4px solid #ff0055;
      padding-left: 10px;
    }

    /* 16:9 Responsive Video Grid Layout */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .video-card {
      background-color: #1a1a24;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #252535;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(255, 0, 85, 0.25);
    }

    /* 16:9 Aspect Ratio Frame */
    .thumbnail-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      position: relative;
    }

    .thumbnail-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: rgba(255, 0, 85, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      pointer-events: none;
    }

    .video-details {
      padding: 12px;
    }

    .video-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e0e0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #888888;
      font-size: 14px;
    }

    /* Video Player Modal */
    .modal-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 95%;
      max-width: 850px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .modal-content video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
      z-index: 1001;
      background: rgba(0,0,0,0.6);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      text-align: center;
      line-height: 32px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">HUB</div>
  </header>

  <div class="container">
    <h2 class="section-title">Latest Videos</h2>
    <div class="video-grid" id="videoGrid">
      <div class="status-msg">Loading videos...</div>
    </div>
  </div>

  <!-- Fullscreen Video Player Modal -->
  <div class="modal-player" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      <video id="fullVideo" controls autoplay></video>
    </div>
  </div>

  <script>
    const WORKER_URL_1 = "https://myapp.8tetaun9.workers.dev";
    const WORKER_URL_2 = ""; 

    async function loadVideos() {
      const grid = document.getElementById("videoGrid");
      let allVideos = [];

      try {
        // Fetch Worker 1
        if (WORKER_URL_1) {
          const res1 = await fetch(WORKER_URL_1);
          const json1 = await res1.json();
          if (json1.success && Array.isArray(json1.data)) {
            allVideos = allVideos.concat(json1.data);
          }
        }

        // Fetch Worker 2 (ရှိပါက)
        if (WORKER_URL_2) {
          try {
            const res2 = await fetch(WORKER_URL_2);
            const json2 = await res2.json();
            if (json2.success && Array.isArray(json2.data)) {
              allVideos = allVideos.concat(json2.data);
            }
          } catch (e) {}
        }

        if (allVideos.length === 0) {
          grid.innerHTML = '<div class="status-msg">No videos found.</div>';
          return;
        }

        grid.innerHTML = "";

        allVideos.forEach(vid => {
          const card = document.createElement("div");
          card.className = "video-card";

          // Main Page မှာ ပထမ 10 စက္ကန့်စာ Preview Play လုပ်မည်
          const previewUrl = `${vid.stream_url}#t=0,10`;

          card.innerHTML = `
            <div class="thumbnail-box" onclick="openPlayer('${vid.stream_url}')">
              <video src="${previewUrl}" preload="metadata" muted loop onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0;"></video>
              <div class="play-overlay">▶</div>
            </div>
            <div class="video-details" onclick="openPlayer('${vid.stream_url}')">
              <div class="video-title">${vid.title || 'Untitled Video'}</div>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        console.error("Error loading videos:", err);
        grid.innerHTML = '<div class="status-msg" style="color:#ff5555;">Failed to load videos. Check Worker URL.</div>';
      }
    }

    function openPlayer(url) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("fullVideo");
      video.src = url;
      modal.style.display = "flex";
      video.play();
    }

    function closePlayer() {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("fullVideo");
      video.pause();
      video.src = "";
      modal.style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", loadVideos);
  </script>
</body>
</html>
