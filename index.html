<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Latest Videos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <!-- HLS.js Library (Android Chrome Native Player ကို တားဆီးရန်) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Video.js JS Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
</head>

<body>

    <!-- Side Menu -->
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item active"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-person-dress"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Latest Videos</h1>
        </div>

        <div class="video-grid" id="videoContainer"></div>
    </main>

    <!-- Video Player Pop-up Modal -->
    <div class="modal-player" id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
        <div style="width:95%; max-width:850px; background:#111; position:relative; border-radius:8px; overflow:hidden;" id="modalContent"></div>
    </div>
<script src="js/app.js"></script>
    <script>
        function renderContent() {
            const container = document.getElementById('videoContainer');
            if(!container) return;
            container.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const isPopular = urlParams.get('sort') === 'popular';

            if(isPopular) {
                const pageTitle = document.getElementById('pageTitle');
                if (pageTitle) pageTitle.innerText = "Popular Videos";
            }

            let displayData = videoData.filter(v => !v.isVip);

            if (isPopular) {
                displayData.sort((a, b) => (b.views || 0) - (a.views || 0));
            }

            if (displayData.length === 0) {
                container.innerHTML = '<p class="empty-msg">ဗီဒီယို မရှိသေးပါ။</p>';
                return;
            }

            // Video Card နှိပ်ပါက openPlayer ခေါ်ယူပြီး m3u8 stream မည်
            displayData.forEach(video => {
                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${video.stream_url}')" style="cursor:pointer;">
                        <div class="thumbnail-box">
                            <img src="${video.thumbnail || ''}" alt="${video.title || ''}">
                            <span class="view-badge"><i class="fa-solid fa-eye"></i> ${video.views || 0}</span>
                        </div>
                        <div class="video-info">
                            <h3>${video.title || ''}</h3>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener("DOMContentLoaded", renderContent);
    </script>

</body>
</html>
