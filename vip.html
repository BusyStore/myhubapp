<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - VIP Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1></h1>
        </div>
        <div class="video-grid" id="vipContainer"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        
        // Login စစ်ဆေးခြင်း
        if (!isLoggedIn()) {
            alert("VIP Zone သို့ ဝင်ရောက်ရန် Login ဝင်ပေးပါခင်ဗျာ!");
            window.location.href = "login.html";
        }

        function renderContent() {
            const container = document.getElementById('vipContainer');
            if(!container) return;
            container.innerHTML = '';

            // VIP Videos သီးသန့် ရွေးထုတ်မည်
            const vipVideos = videoData.filter(v => v.isVip);

            if (vipVideos.length === 0) {
                container.innerHTML = '<p class="empty-msg">VIP Video များ မရှိသေးပါ။</p>';
                return;
            }

            vipVideos.forEach(video => {
                container.innerHTML += `
                    <div class="video-card">
                        <div class="thumbnail-box">
                            <img src="${video.thumbnail || ''}" alt="${video.title || ''}">
                        </div>
                        <div class="video-info">
                            <h3>${video.title || ''}</h3>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener("DOMContentLoaded", renderContent);
    </script>
</body>
</html>
